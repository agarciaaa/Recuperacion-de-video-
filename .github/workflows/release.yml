name: release

# Arma el ZIP portable de Windows con empaquetar.sh: untrunc.exe +
# untrunc-gui.exe + DLL de FFmpeg + ffmpeg.exe/ffprobe.exe + Python 3
# con numpy (carpeta python/). Es el mismo ZIP que se prueba en local:
# se descomprime y se abre con doble clic, sin instalar nada.
#
# - Cada push a main: compila, pasa los tests y deja el ZIP como
#   artefacto del run (Actions > release > el run > Artifacts).
# - Al subir una etiqueta de versión (por ejemplo v1.0.0): además crea
#   una release en BORRADOR con el ZIP y su SHA256. El borrador no es
#   público hasta que alguien lo revisa y pulsa "Publish release".
# - A mano (Actions > release > Run workflow): igual que un push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # FFmpeg se compila aquí mismo (scripts/compilar-ffmpeg.sh): GPLv2,
      # con x264/x265, versión y SHA256 fijados en ese guion.
      LIBUI_VER: "alpha4.1"
      SHA_LIBUI: f0d262959fd96ea5caeef188b56680f7f638e7b3d8a68575ff58e4000ae75109

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v7

      - name: MSYS2 (MINGW64) con gcc, ntldd, Python y numpy
        uses: msys2/setup-msys2@v2
        with:
          # MSYS2 marca MINGW64 como obsoleto y recomienda UCRT64, pero la
          # libui alpha4.1 precompilada (enlazada estática en untrunc-gui)
          # está hecha para msvcrt: con UCRT64 el enlace falla por
          # vsprintf_s / vswprintf_s (probado en noviembre de 2026). Para
          # pasar a UCRT64 hay que compilar libui desde el código.
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          cache: false
          # diffutils: `cmp`, con el que empaquetar.sh comprueba que
          # COPYING va intacto en el ZIP.
          install: git zip unzip curl make diffutils
          # ntldd: lista las DLL que necesita cada .exe (empaquetar.sh).
          # python + numpy: se copian al ZIP en la carpeta python/.
          # nasm, pkgconf, x264, x265, zlib: para compilar FFmpeg.
          pacboy: gcc:p ntldd:p python:p python-numpy:p nasm:p pkgconf:p x264:p x265:p zlib:p

      # La compilación de FFmpeg (~15 min) se guarda en caché. La clave
      # incluye el guion y las versiones de x264/x265: las DLL de FFmpeg
      # enlazan las de x264/x265 por nombre, así que si MSYS2 las
      # actualiza hay que recompilar.
      - name: Clave de caché de FFmpeg
        id: ffclave
        run: |
          v=$(pacman -Q mingw-w64-x86_64-x264 mingw-w64-x86_64-x265 | tr ' \n' '-_')
          echo "clave=ffmpeg-${{ hashFiles('scripts/compilar-ffmpeg.sh') }}-${v}" >> "$GITHUB_OUTPUT"

      - name: Recuperar FFmpeg de la caché
        id: ffcache
        uses: actions/cache/restore@v6
        with:
          path: .ffmpeg-build/destino
          key: ${{ steps.ffclave.outputs.clave }}

      - name: Compilar FFmpeg (GPLv2) e instalarlo en MINGW64
        run: ./scripts/compilar-ffmpeg.sh "$PWD/.ffmpeg-build"

      # Se guarda en cuanto compila, aunque luego falle otro paso.
      - name: Guardar FFmpeg en la caché
        if: steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ffmpeg-build/destino
          key: ${{ steps.ffclave.outputs.clave }}

      - name: Descargar e instalar libui (con SHA256)
        run: |
          libui_base="https://github.com/andlabs/libui/releases/download/${LIBUI_VER}"
          curl -fsSL --retry 5 --retry-delay 10 "${libui_base}/libui-${LIBUI_VER}-windows-amd64-mingw-static.zip" -o libui-static.zip
          echo "${SHA_LIBUI}  libui-static.zip" | sha256sum -c -
          unzip -q -d libui-static libui-static.zip
          find libui-static -name '*.h' -exec cp {} "$MINGW_PREFIX/include/" \;
          find libui-static -name '*.a' -exec cp {} "$MINGW_PREFIX/lib/" \;
          rm -rf libui-static libui-static.zip

      - name: Compilar
        run: |
          make -j4 IS_RELEASE=1
          make -j4 untrunc-gui LIBUI_STATIC=1 IS_RELEASE=1

      - name: Tests
        run: |
          export UNTRUNC_NO_APRENDER=1
          make -j4 untrunc-tests
          ./untrunc-tests.exe

      - name: Empaquetar (empaquetar.sh)
        run: ./empaquetar.sh windows --salida "$PWD/salida"

      - name: Nombre con la versión y SHA256
        id: zip
        run: |
          ver="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) ver="${GITHUB_SHA::7}" ;; esac
          nombre="untrunc-mejorado-${ver}-windows-x64.zip"
          mv salida/untrunc-mejorado-windows-x64.zip "salida/$nombre"
          (cd salida && sha256sum "$nombre" > "$nombre.sha256")
          cat "salida/$nombre.sha256"
          # Código fuente exacto de FFmpeg (GPL): se adjunta a cada versión.
          cp "$MINGW_PREFIX"/share/licenses/ffmpeg-gpl2/ffmpeg-*.tar.xz salida/
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"

      - name: Guardar el ZIP como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.nombre }}
          path: |
            salida/${{ steps.zip.outputs.nombre }}
            salida/${{ steps.zip.outputs.nombre }}.sha256
            salida/ffmpeg-*.tar.xz

  release:
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Bajar el ZIP del paso anterior
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Crear la release en borrador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cat > notas.md <<EOF
          ## Descarga (Windows 10/11, 64 bits)

          1. Descarga **untrunc-mejorado-${tag}-windows-x64.zip** (abajo, en *Assets*).
          2. Descomprímelo entero en cualquier carpeta.
          3. Doble clic en **untrunc-gui.exe**. No hay que instalar nada: ya trae FFmpeg y Python.

          Windows puede mostrar un aviso azul de SmartScreen porque el programa no está
          firmado: pulsa *Más información* → *Ejecutar de todas formas*. Más detalles en
          \`LEEME-Primeros-pasos.txt\`, dentro del ZIP.

          SHA256 del ZIP: ver el archivo \`.sha256\` adjunto.

          El ZIP incluye FFmpeg compilado como GPL-2.0-or-later; su código fuente
          exacto es el \`ffmpeg-*.tar.xz\` adjunto. Licencias en la carpeta
          \`LICENCIAS\` del ZIP.
          EOF
          gh release create "$tag" dist/*.zip dist/*.sha256 dist/ffmpeg-*.tar.xz \
            --draft --title "untrunc-mejorado ${tag}" \
            --notes-file notas.md --generate-notes --verify-tag
